name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install numpy scipy matplotlib openpyxl python-pptx ruff pytest
          pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Lint (ruff)
        run: ruff check .

      - name: Generate synthetic data
        run: |
          python data/generate_skus.py
          python data/generate_history.py

      - name: Smoke — run the CLI pipeline
        run: python -m revops --quiet

      - name: Build deliverables
        run: python -m revops.report

      - name: Build scenario & sensitivity deliverables
        run: python -m revops.scenario --quiet

      - name: Smoke — joint Monte-Carlo risk band (few draws for speed)
        run: python -m revops.simulate --quiet --draws 24

      - name: Smoke — plan compare & € bridge (few draws for speed)
        run: python -m revops.compare --quiet --draws 8

      - name: Build Power BI star schema
        run: python powerbi/build_star.py

      - name: Build web dashboard data
        run: python web/build_data.py

      - name: Tests
        run: pytest -q

      - name: Validate deliverables + Power BI CSVs exist and parse
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          required = [
              "deliverables/prescription.json",
              "deliverables/actions.csv",
              "deliverables/optimization_workbook.xlsx",
              "deliverables/executive_review.pdf",
              "deliverables/scenario_summary.csv",
              "deliverables/sensitivity_tornado.csv",
              "deliverables/sensitivity_tornado.svg",
              "deliverables/plan_compare_summary.csv",
              "deliverables/plan_compare_bridge.csv",
              "deliverables/plan_compare_lines.csv",
              "deliverables/plan_compare.svg",
              "powerbi/data/fact_prescription.csv",
              "powerbi/data/dim_sku.csv",
              "powerbi/data/dim_category.csv",
              "powerbi/data/dim_date.csv",
              "powerbi/data/kpi_headline.csv",
              "web/data.js",
          ]
          missing = [p for p in required if not Path(p).exists()]
          assert not missing, f"missing artefacts: {missing}"

          plan = json.loads(Path("deliverables/prescription.json").read_text(encoding="utf-8"))
          up = plan["expected_uplift"]
          assert up["total_expected_uplift_eur"] > 0, "non-positive uplift"
          assert up["assortment_milp_vs_greedy_eur"] > 0, "MILP did not beat greedy"
          print("OK — total uplift EUR %.0f, MILP-vs-greedy EUR %.0f"
                % (up["total_expected_uplift_eur"], up["assortment_milp_vs_greedy_eur"]))

          # the compare bridge must reconcile exactly in the shipped CSV itself
          import csv
          rows = list(csv.DictReader(
              Path("deliverables/plan_compare_bridge.csv").open(encoding="utf-8")))
          cents = lambda v: int(round(float(v) * 100))
          a, b = rows[0], rows[-1]
          assert cents(a["running_eur"]) + sum(cents(r["delta_eur"]) for r in rows) \
              == cents(b["running_eur"]), "plan-compare bridge does not reconcile"
          print("OK — bridge %s -> %s reconciles exactly"
                % (a["driver"], b["driver"]))
          PY
